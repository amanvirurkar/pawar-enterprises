<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawar Enterprises</title>

  <style>
    /* Premium Initial Loading Screen */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
    }
    .initial-loader-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #FFFFFF;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99999;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #FDEBEB;
      border-top: 4px solid #ED1C24;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
      margin-bottom: 20px;
    }
    .loader-text {
      color: #111827;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loader-text span {
      color: #ED1C24;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="initial-loader-wrapper">
      <div class="loader-spinner"></div>
      <div class="loader-text">Pawar <span>Enterprises</span></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
